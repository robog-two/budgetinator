# Builds, signs, notarizes and publishes Budgetinator for macOS.
#
# Trigger: push a tag v<version> (e.g. `git tag v1.0.1 && git push origin v1.0.1`).
# workflow_dispatch builds the same artifacts without publishing a release (for testing signing).
#
# Release assets per arch (the in-app updater depends on these exact names):
#   Budgetinator-<version>-<arch>.dmg   drag-to-Applications image (signed, notarized, stapled)
#   Budgetinator-<version>-<arch>.zip   `ditto -c -k --keepParent` of the stapled .app
# where <arch> is arm64 or x64.
#
# Required repository secrets (see README "Releasing"):
#   MACOS_CERTIFICATE_P12_BASE64  base64 of the exported "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD    password chosen when exporting the .p12
#   APPLE_TEAM_ID                 10-character Apple Developer Team ID
#   APPLE_API_KEY_P8_BASE64       base64 of the App Store Connect API key (AuthKey_XXXX.p8)
#   APPLE_API_KEY_ID              that key's Key ID
#   APPLE_API_ISSUER_ID           App Store Connect API Issuer ID
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (default: appVersion from gradle.properties). No release is published."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            runner: macos-15        # Apple Silicon
          - arch: x64
            runner: macos-15-intel  # Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Determine version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="$(sed -n 's/^appVersion=//p' gradle.properties)"
          fi
          # CFBundleShortVersionString must be 1-3 dot-separated integers, major > 0.
          if [[ ! "$VERSION" =~ ^[1-9][0-9]*(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Version '$VERSION' must look like 1.2.3 (tag v1.2.3)"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building Budgetinator $VERSION for $ARCH"

      - name: Check runner architecture
        run: |
          expected=$([[ "$ARCH" == arm64 ]] && echo arm64 || echo x86_64)
          actual=$(uname -m)
          [[ "$actual" == "$expected" ]] || { echo "::error::Runner is $actual, expected $expected"; exit 1; }

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for s in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_TEAM_ID; do
            [[ -n "${!s}" ]] || { echo "::error::Missing repository secret $s"; exit 1; }
          done
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"

          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # Developer ID G2 intermediate, in case the .p12 only holds the leaf certificate.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Put it on the search list so codesign/Compose can find the identity.
          read -r -a EXISTING <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$KEYCHAIN" "${EXISTING[@]}"
          rm -f "$RUNNER_TEMP/cert.p12"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" |
            sed -n "s/.*\"\(Developer ID Application: .*($APPLE_TEAM_ID)\)\"$/\1/p" | head -1)
          [[ -n "$IDENTITY" ]] || {
            echo "::error::No 'Developer ID Application: ... ($APPLE_TEAM_ID)' identity in the certificate"
            security find-identity -v -p codesigning "$KEYCHAIN"; exit 1; }
          echo "Signing identity: $IDENTITY"
          {
            echo "MAC_SIGNING_KEYCHAIN=$KEYCHAIN"
            echo "MAC_SIGNING_IDENTITY=$IDENTITY"
          } >> "$GITHUB_ENV"

      - name: Write notary API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          for s in APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            [[ -n "${!s}" ]] || { echo "::error::Missing repository secret $s"; exit 1; }
          done
          KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          echo "NOTARY_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Test
        run: ./gradlew test --console=plain

      - name: Build signed release app (ProGuard)
        run: |
          ./gradlew createReleaseDistributable --console=plain \
            "-PappVersion=$VERSION" -Pmac.sign=true
          APP=build/compose/binaries/main-release/app/Budgetinator.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|flags|Timestamp"
          grep -q -- "-Djpackage.app-version=$VERSION" "$APP/Contents/app/Budgetinator.cfg"
          mkdir -p out
          ditto "$APP" out/Budgetinator.app

      - name: Notarize and staple app
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          notarize() {
            local result id status
            result=$(xcrun notarytool submit "$1" --key "$NOTARY_KEY_PATH" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 1h --output-format json)
            echo "$result"
            id=$(echo "$result" | jq -r '.id')
            status=$(echo "$result" | jq -r '.status')
            if [[ "$status" != "Accepted" ]]; then
              xcrun notarytool log "$id" --key "$NOTARY_KEY_PATH" --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID" || true
              echo "::error::Notarization of $1 finished with status '$status'"; exit 1
            fi
          }
          ditto -c -k --keepParent out/Budgetinator.app "$RUNNER_TEMP/notarize-app.zip"
          notarize "$RUNNER_TEMP/notarize-app.zip"
          xcrun stapler staple out/Budgetinator.app
          xcrun stapler validate out/Budgetinator.app
          spctl --assess --type execute --verbose=2 out/Budgetinator.app

      - name: Package zip and DMG
        run: |
          ditto -c -k --keepParent out/Budgetinator.app "out/Budgetinator-$VERSION-$ARCH.zip"
          packaging/make-dmg.sh out/Budgetinator.app "out/Budgetinator-$VERSION-$ARCH.dmg"
          codesign --force --timestamp --keychain "$MAC_SIGNING_KEYCHAIN" \
            --sign "$MAC_SIGNING_IDENTITY" "out/Budgetinator-$VERSION-$ARCH.dmg"

      - name: Notarize and staple DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          DMG="out/Budgetinator-$VERSION-$ARCH.dmg"
          result=$(xcrun notarytool submit "$DMG" --key "$NOTARY_KEY_PATH" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 1h --output-format json)
          echo "$result"
          status=$(echo "$result" | jq -r '.status')
          if [[ "$status" != "Accepted" ]]; then
            xcrun notarytool log "$(echo "$result" | jq -r '.id')" --key "$NOTARY_KEY_PATH" \
              --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" || true
            echo "::error::Notarization of $DMG finished with status '$status'"; exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - uses: actions/upload-artifact@v7
        with:
          name: Budgetinator-${{ env.VERSION }}-${{ matrix.arch }}
          path: |
            out/Budgetinator-${{ env.VERSION }}-${{ matrix.arch }}.dmg
            out/Budgetinator-${{ env.VERSION }}-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0

      - name: Clean up keychain and key
        if: always()
        run: |
          [[ -n "${MAC_SIGNING_KEYCHAIN:-}" ]] && security delete-keychain "$MAC_SIGNING_KEYCHAIN" || true
          [[ -n "${NOTARY_KEY_PATH:-}" ]] && rm -f "$NOTARY_KEY_PATH" || true

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l assets
          VERSION="${TAG#v}"
          for arch in arm64 x64; do
            for ext in dmg zip; do
              f="assets/Budgetinator-$VERSION-$arch.$ext"
              [[ -f "$f" ]] || { echo "::error::Missing $f"; exit 1; }
            done
          done
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Budgetinator $VERSION" \
            --generate-notes \
            --verify-tag
